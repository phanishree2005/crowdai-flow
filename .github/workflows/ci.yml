name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-go:
    name: Test Go Services (Auth, Telemetry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Build & Test Auth
        run: cd src/auth && go build -v ./... && go test -v ./...
      - name: Build & Test Telemetry
        run: cd src/telemetry && go build -v ./... && go test -v ./...

  test-rust:
    name: Test Rust Services (Routing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler
      - name: Build & Test Routing
        run: cd src/routing && cargo test --verbose

  test-python:
    name: Test Python Services (CV, Predictive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Test CV
        run: cd src/cv && pip install -r requirements.txt && python -m py_compile main.py
      - name: Test Predictive
        run: cd src/predictive && pip install -r requirements.txt && python -m py_compile main.py

  test-java:
    name: Test Java Services (Analytics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Analytics
        run: cd src/analytics && mvn clean package -DskipTests

  test-frontend:
    name: Test Frontends (Web, Ops)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Build Web Dashboard
        run: cd src/web-dashboard && npm ci && npm run build
      - name: Build Ops Dashboard
        run: cd src/ops-dashboard && npm ci && npm run build
