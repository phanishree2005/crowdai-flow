[package]
name = "routing"
version = "0.1.0"
edition = "2021"
authors = ["CrowdFlow Engineering"]

[dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
tonic = "0.10"
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[build-dependencies]
tonic-build = "0.10"
