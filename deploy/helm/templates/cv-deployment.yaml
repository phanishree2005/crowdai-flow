apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cv
  namespace: crowdflow-system
  labels:
    app: crowdflow-cv
spec:
  replicas: {{ .Values.cv.replicas | default 3 }}
  selector:
    matchLabels:
      app: crowdflow-cv
  template:
    metadata:
      labels:
        app: crowdflow-cv
    spec:
      # Require this pod to schedule on GPU nodes
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: cv-service
        image: "{{ .Values.cv.image.repository }}:{{ .Values.cv.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9003
          name: grpc
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "8Gi"
            cpu: "4"
          requests:
            memory: "4Gi"
            cpu: "2"
