global:
  environment: production

replicaCount: 3

image:
  repository: ghcr.io/crowdflow/core
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.crowdflow.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: crowdflow-tls
      hosts:
        - api.crowdflow.io

kafka:
  enabled: true
  replicaCount: 3

redis:
  enabled: true
  architecture: replication
